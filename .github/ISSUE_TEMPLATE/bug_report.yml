name: Bug report
description: Signalement d’un bug reproductible
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que s’est-il passé ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Aller sur …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environnement
      placeholder: "OS / navigateur / version (ex. Windows 11, Chrome 120, app.webamp.studio)"
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: Captures / logs (sans secrets)
      description: Ne collez jamais de clés API, JWT service_role, ni .env
